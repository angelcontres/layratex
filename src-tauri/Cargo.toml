[package]
name = "app"
version = "0.2.0"
description = "Layratex — Local-First P2P Hybrid LaTeX Editor"
authors = ["Angel Contreras"]
license = "MIT"
repository = "https://github.com/angelcontres/layratex"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# NOTA: Mantener solo "staticlib" y "rlib" para escritorio (Windows, Linux, macOS).
# No agregar "cdylib" aquí: en Windows con MinGW/GCC intenta compilar un DLL con >65535
# símbolos exportados y falla con "export ordinal too large: 96641" (límite PE de Windows).
crate-type = ["staticlib", "rlib"]




[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
