<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo chasis oscuro técnico -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#090d16" stroke="#1e293b" stroke-width="4" />

  <!-- Eje central de sincronización / split entre páginas -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="8 6" />

  <!-- HOJA / BORDE IZQUIERDO (Blanco puro #F8FAFC) - Silueta L & Código -->
  <!-- Borde técnico tipo corchete / margen exterior -->
  <path d="M 190 106 L 100 106 L 100 406 L 230 406" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Líneas de código LaTeX local -->
  <line x1="124" y1="154" x2="210" y2="154" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <line x1="124" y1="184" x2="230" y2="184" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  
  <!-- Línea de edición y Cursor activo (Ámbar / Rust) -->
  <line x1="124" y1="214" x2="160" y2="214" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <line x1="172" y1="202" x2="172" y2="226" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />

  <line x1="124" y1="244" x2="218" y2="244" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <line x1="124" y1="274" x2="185" y2="274" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />

  <!-- HOJA / BORDE DERECHO (Gris opaco #64748B) - Preview KaTeX & Peer -->
  <!-- Borde técnico de cierre -->
  <path d="M 322 106 L 412 106 L 412 406 L 282 406" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Símbolo matemático renderizado (Integral / KaTeX) -->
  <path d="M 358 174 C 374 174 376 190 366 220 L 350 270 C 340 300 342 316 358 316" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <line x1="338" y1="245" x2="378" y2="245" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />

  <!-- Nodo de presencia colaborativa P2P -->
  <circle cx="388" cy="130" r="12" fill="#090d16" stroke="#64748b" stroke-width="3" />
  <circle cx="388" cy="130" r="4.5" fill="#f59e0b" />
</svg>